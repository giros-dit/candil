version: '3'

services:
  # NGSI-LD testing
  analytics-server:
    image: testserver
    ports:
     - "8080:8080"
  # Kafka
  kafka:
    image: wurstmeister/kafka:latest
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_PORT: 9092
      KAFKA_LOG_DIRS: "/tmp/kafka-logs"
      KAFKA_CREATE_TOPICS: "yang-push"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - zookeeper
    logging:
      driver: none
  zookeeper:
    image: zookeeper
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181"
    logging:
      driver: none
  # Edge Data Fabric
  edge-postgres:
    image: postgis/postgis
    ports:
      - "5432"
    environment:
      POSTGRES_USER: ngb
      POSTGRES_PASSWORD: ngb
      POSTGRES_DB: ngb
  edge-scorpio:
    image: scorpiobroker/all-in-one-runner:java-latest
    environment:
      DBHOST: edge-postgres
    ports:
      - "9098:9090"
    depends_on:
      - edge-postgres
  gnmic:
    image: ghcr.io/openconfig/gnmic:latest
    volumes:
      - ./gnmic/gnmic.yaml:/app/gnmic.yaml
    command: "subscribe --config /app/gnmic.yaml"
  ncclient:
    image: ncclient-collector
    command: "clab-telemetry-testbed-srl-xe-r2 GigabitEthernet1 1000"
    depends_on:
      - kafka
  # Cloud Data Fabric
  cloud-postgres:
    image: postgis/postgis
    ports:
      - "5432"
    environment:
      POSTGRES_USER: ngb
      POSTGRES_PASSWORD: ngb
      POSTGRES_DB: ngb
  cloud-scorpio:
    image: scorpiobroker/all-in-one-runner:java-latest
    environment:
      DBHOST: cloud-postgres
    ports:
      - "9099:9090"
    depends_on:
      - cloud-postgres
  morph-kgc:
    image: ghcr.io/candil-data-fabric/morph-kgc
    volumes:
      - ./containerlab/clab-telemetry-testbed-srl-xe/topology-data.json:/files/topology-data.json
      - ./mappings/containerlab/:/files
    command: "/files/config.ini"
    depends_on:
      - kafka
  rdf-to-ngsi-ld:
    image: ghcr.io/candil-data-fabric/rdf-to-ngsi-ld:1.3.0
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: containerlab
      BROKER_URI: http://cloud-scorpio:9090/ngsi-ld/v1
      DEBUG: True
    depends_on:
      - morph-kgc
      - kafka

networks:
  default:
    name: clab
    external: true

volumes:
  # This volume will show with 'docker volume ls' as 'docker_data'
  data: {}
