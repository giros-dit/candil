prefixes:
 candil-if: "https://w3id.org/candil/interface#"
 candil-tp: "https://w3id.org/candil/topology#"

mappings:
  network:
    sources:
      access: /files/topology-data.json
      referenceFormulation: jsonpath
      iterator: $
    s: http://example.org/Topology/$(name)
    po:
      - [a, candil-tp:Network]
      - [candil-tp:networkIdentifier, $(name), xsd:string]
  nodes:
    sources:
      access: /files/topology-data.json
      referenceFormulation: jsonpath
      iterator: $.nodes.*
    s: http://example.org/Node/$(longname)
    po:
      - [a, candil-tp:Node]
      - [candil-tp:nodeIdentifier, $(shortname), xsd:string]
      - p: candil-tp:isContainedInNetwork
        o:
          - mapping: network
            condition:
              function: equal
              parameters:
                - [str1, $(labels.containerlab)] # ID of network under `nodes`
                - [str2, $(name)] # ID of network under `network`
  termination-point:
    sources:
      access: /files/topology-data.json
      referenceFormulation: jsonpath
      iterator: $.links.*.*
    s: http://example.org/Node/$(node)/Interface/$(interface)
    po:
      - [a, candil-if:Interface] # Use Interface to skip NGSI-LD multi-type
      - [candil-tp:terminationPointId, $(interface)]
      - p: candil-tp:inNode
        o:
          - mapping: nodes
            condition:
              function: equal
              parameters:
                - [str1, $(node)] # ID of node under `termination-points`
                - [str2, $(shortname)] # ID of node under `nodes`
      - p: candil-tp:terminatesLink
        o:
          - mapping: links
            condition:
              function: equal
              parameters:
                - [str1, $(node)] # ID of node under `termination-points`
                - [str2, $(a.node)] # ID of node under `links`
      - p: candil-tp:terminatesLink
        o:
          - mapping: links
            condition:
              function: equal
              parameters:
                - [str1, $(node)] # ID of node under `termination-points`
                - [str2, $(z.node)] # ID of node under `links`
  links:
    sources:
      access: /files/topology-data.json
      referenceFormulation: jsonpath
      iterator: $.links.*
    s: http://example.org/Node/$(a.node)/Interface/$(a.interface)/Node/$(z.node)/Interface/$(z.interface)
    po:
      - [a, candil-tp:Link]
      - [candil-tp:linkIdentifier, $(a.node)_$(a.interface)_$(z.node)_$(z.interface), xsd:string]
      - p: candil-tp:connectsNode
        o:
          - mapping: nodes
            condition:
              function: equal
              parameters:
                - [str1, $(a.node)] # ID of node under `links`
                - [str2, $(shortname)] # ID of node under `nodes`
      - p: candil-tp:connectsNode
        o:
          - mapping: nodes
            condition:
              function: equal
              parameters:
                - [str1, $(z.node)] # ID of node under `links`
                - [str2, $(shortname)] # ID of node under `nodes`
